<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Conteo de Productos</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700;900&family=Lobster&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <script src="parser.js"></script>
</head>
<body>
  <header class="marca">
    <div class="marca-in">
      <div class="marca-titulo">
        <div class="logo">El Mexiquense</div>
        <div class="marca-sub" id="subtitulo">Conteo de productos vendidos</div>
      </div>
      <button type="button" class="modo" id="modo" role="switch" aria-checked="false" hidden
        title="Cambiar entre el tablero de productos y el de meseros">
        <svg class="modo-ic modo-rep" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><path d="M14 3v6h6M8 17v-3M12 17v-6M16 17v-4"/></svg>
        <span class="modo-pista"><span class="modo-bola"></span></span>
        <svg class="modo-ic modo-per" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7"/></svg>
        <span class="modo-texto"><span class="modo-t-rep">Productos</span><span class="modo-t-per">Meseros <span class="beta">Beta</span></span></span>
      </button>
      <div class="controles" id="controles" hidden>
        <div class="campo">
          <label for="selActual">Reporte</label>
          <select id="selActual"></select>
        </div>
        <div class="campo">
          <label for="selComparar">Comparar contra</label>
          <select id="selComparar"></select>
        </div>
      </div>
      <div class="marca-acciones">
        <label class="btn claro">
          <input type="file" id="inpArchivo" accept=".xlsx,.xls" multiple hidden />
          <svg class="icono" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 16V4M6 10l6-6 6 6M4 20h16"/></svg>
          Subir reporte
        </label>
        <details class="menu">
          <summary class="btn claro" aria-label="Más opciones">⋯</summary>
          <div class="menu-lista">
            <button type="button" id="btnExportar">Exportar historial (respaldo)</button>
            <label>Importar historial<input type="file" id="inpImportar" accept="application/json" hidden /></label>
          </div>
        </details>
      </div>
    </div>
  </header>

  <main>
    <label class="drop" id="drop">
      <svg class="drop-icono" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><path d="M14 3v6h6M8 17v-3M12 17v-6M16 17v-4"/></svg>
      <strong>Arrastra aquí el reporte <em>Ventas por Sucursal</em></strong>
      <span>o haz clic para elegirlo. Puedes subir varios días a la vez.</span>
      <small>El archivo se lee en tu navegador; no se envía a ningún servidor.</small>
    </label>
    <p class="error" id="error" hidden></p>

    <div id="panel" class="tablero" hidden>
      <!-- Pestañas: Bebidas / Alimentos / Comparativo / Datos -->
      <nav class="paneles" id="paneles" role="tablist" aria-label="Panel"></nav>

      <div class="panel-cuerpo">
        <!-- Bebidas o Alimentos: 3 columnas -->
        <section id="vistaPanel" class="vista">
          <div class="leyenda" id="leyenda" aria-label="Colores por área"></div>
          <div id="bloques" class="columnas"></div>
        </section>

        <!-- Comparativo -->
        <section id="vistaComparativo" class="vista comparativo" hidden>
          <div class="tarjeta" id="secComparacion">
            <div class="tarjeta-head">
              <h2>¿Qué subió y qué bajó?</h2>
              <span class="nota" id="notaComparacion"></span>
            </div>
            <div id="graficaComparacion" class="divergente"></div>
          </div>
          <div class="tarjeta" id="secTendencia">
            <div class="tarjeta-head">
              <h2>Tendencia por día</h2>
              <select id="selTendencia" aria-label="Producto"></select>
            </div>
            <div id="graficaTendencia" class="tendencia"></div>
          </div>
        </section>

        <!-- Datos en tabla -->
        <section id="vistaDatos" class="vista datos" hidden>
          <div class="sub-tabs" id="subDatos" role="group" aria-label="Tabla">
            <button type="button" data-tabla="tabla" aria-pressed="true">Conteo del día</button>
            <button type="button" data-tabla="tablaHistorial" aria-pressed="false">Historial <span id="notaHistorial"></span></button>
            <button type="button" data-tabla="tablaDetalle" aria-pressed="false">Líneas del Excel</button>
          </div>
          <div class="tabla-scroll">
            <table id="tabla"><thead></thead><tbody></tbody></table>
            <table id="tablaHistorial" hidden><thead></thead><tbody></tbody></table>
            <table id="tablaDetalle" hidden>
              <thead><tr><th>Producto</th><th>Tabla</th><th>Nombre en el reporte</th><th>Área</th><th class="num">Cantidad</th><th class="num">×</th><th class="num">Unidades</th></tr></thead>
              <tbody></tbody>
            </table>
          </div>
        </section>
      </div>
    </div>

    <!-- Tablero de meseros (se llena desde meseros.js) -->
    <div id="tableroMeseros" class="tablero" hidden>
      <nav class="paneles paneles-m" id="mPestanas" role="tablist" aria-label="Meseros"></nav>
      <div class="panel-cuerpo" id="mCuerpo"></div>
    </div>
  </main>

  <div class="tooltip" id="tooltip" role="tooltip" hidden></div>
  <script src="meseros.js"></script>
  <script src="app.js"></script>
</body>
</html>
